<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A local-first, content-agnostic Markdown study portal."
    />
    <title>Study Portal</title>
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("study-portal-reading-theme");
          if (["light", "warm", "dark"].includes(savedTheme)) {
            document.documentElement.dataset.readingTheme = savedTheme;
          }
        } catch (error) {
          // A private browser may not expose local storage; the default light theme still works.
        }
      })();
    </script>
    <link rel="icon" type="image/png" sizes="256x256" href="favicon.png?v=20260903-usyd-shield-1" />
    <link rel="apple-touch-icon" href="favicon.png?v=20260903-usyd-shield-1" />
    <link rel="stylesheet" href="vendor/katex/katex.min.css" />
  <link rel="stylesheet" href="styles.css?v=20260915-reading-settings-1" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到笔记正文</a>

    <header class="topbar">
      <div class="topbar__identity">
        <button
          class="icon-button mobile-nav-toggle"
          id="nav-toggle"
          type="button"
          aria-label="收起课程导航"
          aria-controls="sidebar"
          aria-expanded="true"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M4 5h16v14H4zM9 5v14" />
          </svg>
        </button>
        <button
          class="brand"
          id="brand-home"
          type="button"
          aria-label="The University of Sydney Study Portal 首页"
        >
          <img class="brand__usyd-logo" src="USydLogoBlack.svg.png" alt="" />
          <span class="brand__divider" aria-hidden="true"></span>
          <span class="brand__product">Study Portal</span>
        </button>
      </div>

      <div class="topbar__actions">
        <label class="semester-picker" id="semester-picker">
          <span class="sr-only">选择学期</span>
          <select id="semester-select" aria-label="选择学期"></select>
        </label>
        <div
          class="current-note-indicator"
          id="current-note-indicator"
          role="status"
          aria-live="polite"
          aria-atomic="true"
          hidden
        >
          <span class="current-note-indicator__label" id="current-note-label">当前笔记</span>
          <span class="current-note-indicator__value">
            <span id="current-note-unit">Unit</span>
            <span aria-hidden="true">·</span>
            <span class="current-note-indicator__week" id="current-note-week">Week</span>
            <span class="current-note-indicator__week-short" id="current-note-week-short">W</span>
          </span>
        </div>
        <div class="topbar__reading-utility" id="topbar-reading-utility" hidden>
          <button
            class="print-trigger"
            id="print-trigger"
            type="button"
            aria-label="打印当前笔记或保存为 A4 PDF"
            title="打印当前笔记或保存为 A4 PDF"
            hidden
            disabled
          >
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M7 8V4.5h10V8M7 16H5.5A1.5 1.5 0 0 1 4 14.5v-5A1.5 1.5 0 0 1 5.5 8h13A1.5 1.5 0 0 1 20 9.5v5a1.5 1.5 0 0 1-1.5 1.5H17" />
              <path d="M7 13.5h10v6H7zM17.5 11.5h.01" />
            </svg>
            <span>打印 / PDF</span>
          </button>
          <time class="immersion-clock" id="immersion-clock" aria-hidden="true">
            <span class="immersion-clock__date" id="immersion-clock-date"></span>
            <span class="immersion-clock__date immersion-clock__date--compact" id="immersion-clock-date-compact"></span>
            <span class="immersion-clock__time" id="immersion-clock-time"></span>
          </time>
        </div>
        <button class="search-trigger" id="search-trigger" type="button" aria-label="搜索笔记">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="6.5" />
            <path d="m16 16 4 4" />
          </svg>
          <span>搜索笔记</span>
          <kbd>/</kbd>
        </button>
      </div>
    </header>

    <div class="reading-progress" id="reading-progress" aria-hidden="true" hidden>
      <span></span>
    </div>

    <button
      class="last-read-marker"
      id="last-read-marker"
      type="button"
      aria-label="跳转到上次阅读位置"
      title="跳转到上次阅读位置"
      hidden
    >
      <span aria-hidden="true"></span>
      <span class="last-read-marker__label">上次读到</span>
    </button>

    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="课程与周次导航">
        <div class="sidebar__header">
          <div>
            <p class="sidebar__term" id="sidebar-term">Semester study notes</p>
            <p class="sidebar__summary" id="sidebar-summary">Loading library…</p>
          </div>
          <button class="icon-button mobile-only" id="nav-close" type="button" aria-label="关闭课程导航">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m6 6 12 12M18 6 6 18" />
            </svg>
          </button>
        </div>

        <button class="library-link" id="library-link" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M4 5.5h6.5v13H4zM13.5 5.5H20v13h-6.5z" />
          </svg>
          <span>Study overview</span>
        </button>

        <nav id="course-navigation" class="course-navigation" aria-label="课程列表"></nav>

        <div class="sidebar__footer">
          <span class="status-dot" aria-hidden="true"></span>
          <span>Local library</span>
          <span class="sidebar__footer-separator" aria-hidden="true">·</span>
          <span>Synced notes</span>
        </div>
      </aside>

      <button
        class="sidebar-edge-toggle"
        id="sidebar-edge-toggle"
        type="button"
        aria-label="收起课程导航"
        aria-controls="sidebar"
        aria-expanded="true"
      >
        <svg aria-hidden="true" viewBox="0 0 16 24">
          <path d="m10.5 5-5 7 5 7" />
        </svg>
      </button>

      <button class="sidebar-scrim" id="sidebar-scrim" type="button" aria-label="关闭课程导航"></button>

      <button
        class="toc-toggle"
        id="toc-toggle"
        type="button"
        aria-label="打开本页目录"
        aria-controls="toc-panel"
        aria-expanded="false"
        hidden
      >
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M4 6h2M9 6h11M4 12h2M9 12h11M4 18h2M9 18h11" />
        </svg>
        <span>本页目录</span>
      </button>

      <button
        class="assistant-toggle"
        id="assistant-toggle"
        type="button"
        aria-label="打开问笔记"
        aria-controls="toc-panel"
        aria-expanded="false"
        hidden
      >
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M7 18.5 4.5 20l.8-3A7.5 7.5 0 1 1 19.5 13c0 4-3.7 7-8.2 7-1.6 0-3.1-.4-4.3-1.1" />
          <path d="M9 8.5h5M9 12h3.5" />
        </svg>
        <span>问笔记</span>
      </button>

      <button class="toc-scrim" id="toc-scrim" type="button" aria-label="关闭阅读工具" hidden></button>

      <div class="reader-control-dock" id="reader-control-dock" role="group" aria-label="阅读工具" hidden>
        <button
          class="immersion-toggle"
          id="immersion-toggle"
          type="button"
          aria-pressed="false"
          aria-label="开启沉浸阅读"
          title="开启沉浸阅读"
          hidden
        >
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M8 4H4v4M16 4h4v4M20 16v4h-4M4 16v4h4" />
          </svg>
        </button>
        <button class="back-to-top" id="back-to-top" type="button" aria-label="回到页首" title="回到页首" hidden>
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="m7 11 5-5 5 5M12 6v12" />
          </svg>
        </button>
      </div>

      <button class="selection-ask-ai" id="selection-ask-ai" type="button" aria-label="询问选中的正文" hidden>
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M7 18.5 4.5 20l.8-3A7.5 7.5 0 1 1 19.5 13c0 4-3.7 7-8.2 7-1.6 0-3.1-.4-4.3-1.1" />
          <path d="M9 8.5h5M9 12h3.5" />
        </svg>
        <span>问 AI</span>
      </button>

      <main class="main" id="main-content" tabindex="-1">
        <div id="view-root"></div>
      </main>

      <aside class="toc-panel utility-panel" id="toc-panel" aria-label="阅读工具">
        <div class="utility-panel__topbar">
          <div class="utility-tabs" role="tablist" aria-label="阅读工具">
            <button
              class="utility-tab"
              id="toc-tab"
              type="button"
              role="tab"
              aria-selected="true"
              aria-controls="toc-view"
            >本页目录</button>
            <button
              class="utility-tab"
              id="preferences-tab"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="preferences-view"
            >阅读外观</button>
            <button
              class="utility-tab"
              id="assistant-tab"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="assistant-view"
            >问笔记</button>
          </div>
          <button class="icon-button toc-close" id="toc-close" type="button" aria-label="关闭本页目录">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m6 6 12 12M18 6 6 18" />
            </svg>
          </button>
        </div>

        <section class="utility-view toc-view" id="toc-view" role="tabpanel" aria-labelledby="toc-tab">
          <p class="utility-eyebrow">On this page</p>
          <nav id="toc-navigation"></nav>
        </section>

        <section
          class="utility-view preferences-view"
          id="preferences-view"
          role="tabpanel"
          aria-labelledby="preferences-tab"
          hidden
        >
          <p class="utility-eyebrow">阅读外观</p>
          <div class="reading-preferences" role="group" aria-label="阅读配色">
            <span class="reading-preferences__label">阅读配色</span>
            <p class="reading-preferences__hint">选择适合长时间阅读的页面配色。</p>
            <div class="reading-theme-options">
              <button class="reading-theme-option" type="button" data-reading-theme="light" aria-pressed="true">
                <span class="reading-theme-option__swatch reading-theme-option__swatch--light" aria-hidden="true"></span>
                <span>白昼</span>
              </button>
              <button class="reading-theme-option" type="button" data-reading-theme="warm" aria-pressed="false">
                <span class="reading-theme-option__swatch reading-theme-option__swatch--warm" aria-hidden="true"></span>
                <span>暖纸</span>
              </button>
              <button class="reading-theme-option" type="button" data-reading-theme="dark" aria-pressed="false">
                <span class="reading-theme-option__swatch reading-theme-option__swatch--dark" aria-hidden="true"></span>
                <span>夜间</span>
              </button>
            </div>
          </div>
        </section>

        <section
          class="utility-view assistant-view"
          id="assistant-view"
          role="tabpanel"
          aria-labelledby="assistant-tab"
          hidden
        >
          <div class="assistant-header">
            <div>
              <div class="assistant-title-row">
                <h2>问笔记</h2>
                <span class="assistant-status" id="assistant-status" data-state="checking">
                  <span class="assistant-status__dot" aria-hidden="true"></span>
                  <span id="assistant-status-label">正在检查本地模型…</span>
                </span>
              </div>
            </div>
            <button
              class="assistant-clear"
              id="assistant-clear"
              type="button"
              title="清空当前会话及其上下文；下一轮从全新对话开始"
              aria-label="清空对话"
            >清空</button>
          </div>

          <div class="assistant-recovery" id="assistant-recovery" hidden>
            <p id="assistant-recovery-message">本地模型暂时不可用，笔记阅读不受影响。</p>
            <button id="assistant-retry" type="button">重新启动模型</button>
          </div>

          <p class="assistant-session-notice" id="assistant-session-notice" aria-live="polite" hidden></p>

          <label class="assistant-scope-control" id="assistant-scope-control" for="assistant-scope">
            <span>范围</span>
            <select id="assistant-scope" aria-label="检索范围">
              <option value="section">当前章节</option>
              <option value="week">当前 Week</option>
              <option value="unit">当前 Unit</option>
              <option value="all">全部笔记</option>
            </select>
          </label>

          <div class="assistant-messages" id="assistant-messages" aria-live="polite">
            <div class="assistant-empty" id="assistant-empty">
              <h3>开始提问</h3>
            </div>
          </div>

          <form class="assistant-composer" id="assistant-form">
            <div class="assistant-composer__toolbar">
              <label class="assistant-quick-control assistant-quick-control--backend" for="assistant-backend">
                <span>模型</span>
                <select id="assistant-backend" aria-label="选择回答模型">
                  <option value="gemini_flash">Gemini 3.5 Flash</option>
                  <option value="deepseek_v4_flash">DeepSeek V4 Flash</option>
                  <option value="local_qwen_4b">本地 Qwen 4B</option>
                </select>
              </label>
              <details class="assistant-advanced" id="assistant-advanced-settings">
                <summary>选项</summary>
                <div class="assistant-advanced__panel">
                  <label class="assistant-setting" for="assistant-reply-length">
                    <span>回答长度</span>
                    <select id="assistant-reply-length" aria-label="回答长度">
                      <option value="">跟随 App 设置</option>
                      <option value="512">简洁 · 512</option>
                      <option value="1024">标准 · 1,024</option>
                      <option value="1536">更长 · 1,536</option>
                      <option value="2048">深入 · 2,048</option>
                    </select>
                  </label>
                  <label class="assistant-setting" id="assistant-reasoning-setting" for="assistant-reasoning-mode">
                    <span>回答模式</span>
                    <select id="assistant-reasoning-mode" aria-label="回答模式">
                      <option value="">跟随 App · 快速优先</option>
                      <option value="non_thinking">快速回答</option>
                      <option value="thinking">深入推理</option>
                    </select>
                  </label>
                  <p class="assistant-context-meta" id="assistant-context-meta" aria-live="polite">
                    本轮上下文读取中…
                  </p>
                </div>
              </details>
            </div>
            <div class="assistant-selection-reference" id="assistant-selection-reference" hidden>
              <div class="assistant-selection-reference__copy">
                <span class="assistant-selection-reference__label" id="assistant-selection-label">引用正文</span>
                <p id="assistant-selection-text"></p>
              </div>
              <button id="assistant-selection-clear" type="button" aria-label="移除已引用的正文" title="移除引用">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17" /></svg>
              </button>
            </div>
            <label class="sr-only" for="assistant-input">询问这份笔记</label>
            <textarea
              id="assistant-input"
              rows="2"
              maxlength="800"
              placeholder="问点什么？"
            ></textarea>
            <div class="assistant-composer__actions">
              <span class="assistant-model-label" id="assistant-model-label" hidden>
                <span aria-hidden="true"></span>
                <span id="assistant-model-label-text">正在检查本地模型…</span>
              </span>
              <button class="assistant-stop" id="assistant-stop" type="button" hidden>停止</button>
              <button class="assistant-send" id="assistant-send" type="submit" aria-label="发送问题">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m4 4 17 8-17 8 3-8-3-8Z" /><path d="M7 12h14" /></svg>
              </button>
            </div>
          </form>
        </section>
      </aside>
    </div>

    <dialog class="search-dialog" id="search-dialog" aria-labelledby="search-title">
      <div class="search-dialog__header">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="6.5" />
          <path d="m16 16 4 4" />
        </svg>
        <label class="sr-only" for="search-input" id="search-title">搜索全部笔记</label>
        <input
          id="search-input"
          type="search"
          placeholder="搜索全部笔记正文…"
          autocomplete="off"
        />
        <button class="dialog-close" id="search-close" type="button" aria-label="关闭搜索">Esc</button>
      </div>
      <div class="search-dialog__scope">
        <span id="search-scope-term">Semester notes</span>
        <span id="search-count">Loading…</span>
      </div>
      <div class="search-results" id="search-results" aria-live="polite"></div>
    </dialog>

    <script src="vendor/marked.umd.js"></script>
    <script src="vendor/katex/katex.min.js"></script>
  <script src="app.js?v=20260915-reading-settings-1"></script>
  </body>
</html>
