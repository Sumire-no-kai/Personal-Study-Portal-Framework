name: Windows desktop

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - "servers/desktop-windows/**"
      - "LICENSE"
      - "vendor/**"
      - ".github/workflows/windows-desktop.yml"
      - ".github/scripts/windows-release*"
  pull_request:
    paths:
      - "servers/desktop-windows/**"
      - "LICENSE"
      - "vendor/**"
      - ".github/workflows/windows-desktop.yml"
      - ".github/scripts/windows-release*"

permissions:
  contents: read

jobs:
  release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Test stable and prerelease publication rules
        run: node --test .github/scripts/windows-release.test.mjs
      - name: Validate release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node .github/scripts/windows-release.mjs --check-tag "$RELEASE_TAG"

  build:
    name: build (${{ matrix.arch }})
    needs: release-policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: servers/desktop-windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check application and release versions
        shell: pwsh
        env:
          NOTE_PORTAL_REF_TYPE: ${{ github.ref_type }}
          NOTE_PORTAL_REF_NAME: ${{ github.ref_name }}
        run: |
          $appVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($appVersion -ne $packageVersion -or $appVersion -ne $cargoVersion) { throw "Desktop version manifests differ" }
          if ($env:NOTE_PORTAL_REF_TYPE -eq 'tag' -and $env:NOTE_PORTAL_REF_NAME -ne "v$appVersion") { throw "Release tag does not match app version" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: servers/desktop-windows/package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.arch }}
          workspaces: servers/desktop-windows/src-tauri
      - name: Verify native runner and install Rust target
        run: |
          $hostArch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          if ($hostArch -ne "${{ matrix.arch }}") { throw "Expected ${{ matrix.arch }} runner, found $hostArch" }
          rustup target add ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install frontend dependencies
        run: npm ci
      - name: Test reader localisation
        run: npm test
      - name: Check reader and frontend
        run: |
          node --check reader/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check reader/theme-init.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check reader/i18n.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check Rust formatting and tests
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build unsigned NSIS installer
        run: npx tauri build --target ${{ matrix.target }}
      # SignPath integration must sign both files before this stable-release gate.
      - name: Verify application and installer signing status
        shell: pwsh
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          $stable = $env:RELEASE_REF_TYPE -eq 'tag' -and -not $env:RELEASE_REF_NAME.Contains('-')
          $app = Get-Item 'src-tauri/target/${{ matrix.target }}/release/note-portal-desktop.exe' -ErrorAction Stop
          $installers = @(Get-ChildItem 'src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer for signature verification' }
          foreach ($file in @($app) + $installers) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            Write-Host "$($file.Name): $($signature.Status)"
            if ($stable -and ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate)) {
              throw "Stable release requires a valid Windows signature: $($file.Name)"
            }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: note-portal-windows-${{ matrix.arch }}-installer
          path: servers/desktop-windows/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Require tag on current master
        run: |
          git fetch --no-tags --depth=1 origin master
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: note-portal-windows-*-installer
          path: release
          merge-multiple: true
      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node .github/scripts/windows-release.mjs "$RELEASE_TAG" release
