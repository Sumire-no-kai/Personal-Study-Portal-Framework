name: Windows desktop

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*-alpha.*"
    paths:
      - "servers/desktop-windows/**"
      - "LICENSE"
      - "vendor/**"
      - ".github/workflows/windows-desktop.yml"
  pull_request:
    paths:
      - "servers/desktop-windows/**"
      - "LICENSE"
      - "vendor/**"
      - ".github/workflows/windows-desktop.yml"

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: servers/desktop-windows
    steps:
      - uses: actions/checkout@v4
      - name: Check application and release versions
        shell: pwsh
        env:
          NOTE_PORTAL_REF_TYPE: ${{ github.ref_type }}
          NOTE_PORTAL_REF_NAME: ${{ github.ref_name }}
        run: |
          $appVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($appVersion -ne $packageVersion -or $appVersion -ne $cargoVersion) { throw "Desktop version manifests differ" }
          if ($env:NOTE_PORTAL_REF_TYPE -eq 'tag' -and $env:NOTE_PORTAL_REF_NAME -ne "v$appVersion") { throw "Release tag does not match app version" }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: servers/desktop-windows/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
          workspaces: servers/desktop-windows/src-tauri
      - name: Verify native runner and install Rust target
        run: |
          $hostArch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          if ($hostArch -ne "${{ matrix.arch }}") { throw "Expected ${{ matrix.arch }} runner, found $hostArch" }
          rustup target add ${{ matrix.target }}
      - name: Install frontend dependencies
        run: npm ci
      - name: Check reader and frontend
        run: |
          node --check reader/app.js
          node --check reader/theme-init.js
          npm run build
      - name: Check Rust formatting and tests
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build unsigned NSIS installer
        run: npx tauri build --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: note-portal-windows-${{ matrix.arch }}-installer
          path: servers/desktop-windows/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Require tag on current master
        run: |
          git fetch --no-tags --depth=1 origin master
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
      - uses: actions/download-artifact@v4
        with:
          pattern: note-portal-windows-*-installer
          path: release
          merge-multiple: true
      - name: Publish Windows alpha prerelease
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(./*-setup.exe)
          test "${#installers[@]}" -eq 2
          for installer in "${installers[@]}"; do
            release_installer="${installer// /.}"
            if [[ "$installer" != "$release_installer" ]]; then
              test ! -e "$release_installer"
              mv "$installer" "$release_installer"
            fi
          done
          x64=(./*_x64-setup.exe)
          arm64=(./*_arm64-setup.exe)
          test "${#x64[@]}" -eq 1
          test "${#arm64[@]}" -eq 1
          sha256sum "${x64[0]}" "${arm64[0]}" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" "${x64[0]}" "${arm64[0]}" SHA256SUMS.txt \
            --verify-tag --prerelease --latest=false \
            --title "Note Portal $GITHUB_REF_NAME (Windows alpha)" \
            --notes "Windows 预发布版：根据设备选择 x64 或 ARM64 的 *-setup.exe 安装，GitHub 自动提供对应源码。ARM64 安装器外壳可能使用 x86 模拟，安装后的应用主体为 ARM64。首次启动请打开并读完整使用提示、完成不可跳过的简短指引，然后选择本机 Markdown 文件夹。小窗口按系统语言默认显示中文或英文，可在设置中切换；Windows 阅读页支持主题色与本机 Logo。服务仅监听本机，不内置 AI，也不会上传笔记。安装包未签名，可能触发 Windows SmartScreen 提示；仍需干净系统验证，请仅在你信任的电脑上试用。此版本不适合公网部署。" \
            --generate-notes
